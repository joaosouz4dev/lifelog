<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifelog</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1><img src="/static/icon.png" alt="" class="logo" width="24" height="24">Lifelog</h1>
  <nav>
    <div class="tabs" role="tablist">
      <button class="tab is-active" data-view="timeline" role="tab">Timeline</button>
      <button class="tab" data-view="reports" role="tab">Relatórios</button>
      <button class="tab" data-view="chat" role="tab">Chat</button>
    </div>
    <input type="date" id="day-picker" aria-label="Escolher dia">
    <input type="search" id="search-box" placeholder="Buscar na transcrição…" aria-label="Buscar">
    <button id="hub-btn" type="button" title="Provedores e custos">Hub</button>
  </nav>
</header>

<section id="stats" class="stats" aria-live="polite"></section>

<main>
  <!-- Timeline -->
  <div id="view-timeline">
    <div id="timeline" class="timeline"></div>
    <p id="empty" class="empty" hidden>
      Nada capturado neste dia.<br>
      <small id="empty-hint">A captura roda sozinha — verifique o ícone do Lifelog na bandeja.</small>
    </p>
  </div>

  <!-- Chat -->
  <div id="view-chat" hidden>
    <div id="chat-log" class="chat-log">
      <p class="empty">
        Pergunte sobre o que você falou ou ouviu.<br>
        <small>Ex.: "o que eu falei sobre o orçamento?" · "o que aconteceu ontem?"</small>
      </p>
    </div>
    <form id="chat-form" class="chat-form">
      <input type="text" id="chat-input" placeholder="Pergunte sobre suas conversas…"
             autocomplete="off" aria-label="Pergunta">
      <button type="submit" id="chat-send">Perguntar</button>
    </form>
  </div>

  <!-- Relatórios -->
  <div id="view-reports" hidden>
    <div class="report-actions">
      <button id="gen-daily" type="button">Gerar relatório de ontem</button>
      <button id="gen-monthly" type="button">Gerar relatório do mês passado</button>
      <span id="gen-feedback" class="feedback" aria-live="polite"></span>
    </div>
    <div class="report-layout">
      <aside id="report-list" class="report-list"></aside>
      <article id="report-body" class="report-body">
        <p class="empty">Escolha um relatório à esquerda.</p>
      </article>
    </div>
  </div>
</main>

<footer class="app-footer">
  <span id="version-label">Lifelog</span>
  <span id="update-status" class="update-status"></span>
</footer>

<dialog id="hub-dialog">
  <h2>Provedores</h2>
  <div id="hub-body"></div>
  <form method="dialog"><button>Fechar</button></form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
