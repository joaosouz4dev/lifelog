# Lifelog — configuração
#
# Segredos NÃO ficam aqui. Use variáveis de ambiente (${VAR}) ou config.local.yaml
# (que está no .gitignore e sobrescreve este arquivo).

server:
  host: 0.0.0.0
  port: 8000
  data_dir: ./data
  db_path: ./data/lifelog.db

# ─────────────────────────────────────────────────────────────
# Hub de transcrição (STT)
# A cadeia é tentada em ordem. Provedor que falha entra em
# circuit breaker e o próximo assume.
# ─────────────────────────────────────────────────────────────
stt:
  chain: [faster_whisper_local, deepgram]

  # Idioma do pipeline, independente de qual provedor atende.
  language: pt

  # Teto de gasto diário com provedores pagos. Ao estourar, só os
  # provedores locais continuam; os pagos são pulados.
  daily_budget_cents: 200

  circuit_breaker:
    failure_threshold: 3      # falhas consecutivas para abrir
    reset_after_seconds: 300  # tempo até tentar de novo

  providers:
    faster_whisper_local:
      type: faster_whisper
      model: large-v3
      device: cuda            # cai para cpu automaticamente se não houver GPU
      # int8 economiza ~1,8 GB de VRAM, mas medido sobre 30 segmentos reais
      # divergiu do float16 em 23% deles — e não só em detalhe: trocou
      # "fala aí, baixinha" por "olha aí, baixinho" e "opa, grande" por
      # "opa, peraí". Também ficou mais lento (29,4s contra 26,6s). Só vale
      # se a VRAM for escassa a ponto de não caber o float16.
      compute_type: float16
      language: pt
      beam_size: 5
      # O large-v3 segura ~3,8 GB de VRAM. Depois deste tempo sem transcrever
      # o modelo é descarregado e a placa fica livre; a próxima fala paga ~7s
      # de recarga. Use 0 para manter o modelo sempre carregado.
      idle_unload_seconds: 300

    deepgram:
      type: deepgram
      enabled: false          # ative quando tiver a chave
      api_key: ${DEEPGRAM_API_KEY}
      model: nova-2
      language: pt-BR

    # Ainda sem implementação: o tipo 'openai' não está no registry de
    # server/hub/stt/. Deixado como esboço do formato; ativar exige escrever
    # o provedor primeiro.
    openai_whisper:
      type: openai
      enabled: false
      api_key: ${OPENAI_API_KEY}
      model: whisper-1

# ─────────────────────────────────────────────────────────────
# Hub de LLM (relatórios e chat)
# Mesma mecânica do hub de STT: cadeia com fallback, circuit breaker e teto.
# ─────────────────────────────────────────────────────────────
llm:
  # `echo` fica por último: não usa modelo nenhum, só organiza a transcrição.
  # Garante que sempre haja um relatório, mesmo sem chave nem Ollama.
  chain: [claude, ollama, echo]

  # ~R$0,30/dia. Um relatório diário custa poucos centavos com sonnet-5.
  daily_budget_cents: 500

  circuit_breaker:
    failure_threshold: 3
    reset_after_seconds: 300

  providers:
    claude:
      type: anthropic
      enabled: false          # ative depois de exportar ANTHROPIC_API_KEY
      api_key: ${ANTHROPIC_API_KEY}
      # sonnet-5 dá conta de resumir transcrição; troque para claude-opus-5
      # se quiser mais profundidade no relatório mensal.
      model: claude-sonnet-5
      max_tokens: 16000
      effort: medium          # low | medium | high | xhigh | max

    ollama:
      type: ollama
      enabled: false          # ative se tiver Ollama rodando
      base_url: http://localhost:11434
      model: qwen2.5:14b

    # Sem modelo de linguagem: devolve a transcrição organizada por hora.
    # Não resume nem interpreta — é a rede de segurança da cadeia.
    echo:
      type: echo

# ─────────────────────────────────────────────────────────────
# Captura (lido pelos clientes)
# ─────────────────────────────────────────────────────────────
capture:
  sample_rate: 16000

  vad:
    threshold: 0.5            # 0..1 — acima disso é fala
    # 700ms filtra ruídos e interjeições soltas. Em teste real, trechos de
    # ~600ms chegavam ao Whisper e voltavam vazios ou com confiança baixa,
    # gastando GPU à toa. Abaixe se estiver perdendo respostas curtas ("sim").
    min_speech_ms: 700
    min_silence_ms: 700       # silêncio que encerra um segmento
    padding_ms: 300           # margem antes/depois da fala
    max_segment_ms: 30000     # corta fala contínua que não faz pausa

  encode:
    codec: opus
    bitrate: 24000

  # AINDA NÃO IMPLEMENTADO (previsto para a Fase 4).
  # Janelas/apps cujo áudio de sistema deve ser ignorado. Casa por substring,
  # sem diferenciar maiúsculas. Nomes de janela são um conceito do Windows;
  # no Android o equivalente será package name.
  windows_blocklist:
    - "1Password"
    - "Bitwarden"
    - "KeePass"

# ─────────────────────────────────────────────────────────────
# Privacidade e retenção
# ─────────────────────────────────────────────────────────────
retention:
  audio_days: 30              # 0 = apagar áudio logo após transcrever
  transcript_days: 0          # 0 = manter para sempre
